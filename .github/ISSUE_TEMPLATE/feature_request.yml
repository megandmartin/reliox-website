name: Suggest an improvement
description: A focused idea for the website, accessibility or public documentation.
title: "[Idea]: "
body:
  - type: markdown
    attributes:
      value: |
        This repository covers the Reliox website and public release information. Tell us about the problem before the proposed solution. Please use example data; this discussion is public.
  - type: textarea
    id: problem
    attributes:
      label: What would this help someone do?
      description: Describe the person, page and difficulty involved. Include a public page link if relevant.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the smallest useful change and how someone would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Optional alternatives you considered, related issues or public examples.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I checked existing issues and removed private information from this proposal and its attachments.
          required: true

name: Report a problem
description: A broken page, download link, installation instruction or website interaction.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Reliox. This is a **public** report. Use example data and remove private messages, contact details, tokens and personal information from text, screenshots and logs. For a suspected security vulnerability, use [private reporting](https://github.com/megandmartin/reliox-website/security/advisories/new).
  - type: input
    id: page
    attributes:
      label: Affected page or download
      description: Paste the public URL or name the relevant page. For a download problem, include the Reliox version.
      placeholder: https://www.relioxos.com/download/
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, and where did the problem appear?
      placeholder: |
        1. Open the download page.
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Explain what you expected and what happened instead. Include a screenshot if helpful, with personal data removed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      description: Include versions when known. For Mac installation problems, note Apple Silicon or Intel.
      placeholder: Safari on macOS 14, Apple Silicon
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I checked existing issues and removed private information from this report and its attachments.
          required: true
